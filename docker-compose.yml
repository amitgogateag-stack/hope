services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: hope
      POSTGRES_USER: hope
      POSTGRES_PASSWORD: change-me
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hope -d hope"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
