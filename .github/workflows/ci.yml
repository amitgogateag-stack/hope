name: HOPE CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17@sha256:d74eeac9a635390a49bc21bd49fccd973de707e2a53a76ac49b552b8712ec46f
        env:
          POSTGRES_USER: hope
          POSTGRES_PASSWORD: hope
          POSTGRES_DB: hope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope -d hope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -c constraints/ci-test.txt -e '.[test]'
      - name: Tests
        env:
          HOPE_DATABASE_URL: postgresql+psycopg://hope:hope@localhost:5432/hope
        run: pytest --cov=hope --cov-report=term-missing --cov-fail-under=89
