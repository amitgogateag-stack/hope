name: HOPE CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: hope
          POSTGRES_PASSWORD: hope
          POSTGRES_DB: hope
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hope -d hope"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -e '.[test]'
      - name: Tests
        env:
          HOPE_DATABASE_URL: postgresql+psycopg://hope:hope@localhost:5432/hope
        run: pytest
