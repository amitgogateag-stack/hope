name: M4 independent security
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  admission:
    name: Independent admission (PostgreSQL ${{ matrix.postgres }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: security_admin
          POSTGRES_PASSWORD: disposable_ci_only
          POSTGRES_DB: security_adversarial
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U security_admin -d security_adversarial"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.13'
      - name: Install
        run: python -m pip install -c constraints/ci-test.txt -e '.[test]'
      - name: Record exact tested commit
        run: git rev-parse HEAD > tested-commit.txt
      - name: Standalone adversarial acceptance (fails until trusted attestor exists)
        env:
          SECURITY_DATABASE_URL: postgresql+psycopg://security_admin:disposable_ci_only@localhost:5432/security_adversarial
          SECURITY_POSTGRES_MAJOR: ${{ matrix.postgres }}
        run: python security/run_adversarial.py
      - name: Publish human evidence
        if: always()
        run: |
          test -s security-evidence/report.json
          cat security-evidence/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: independent-security-pg${{ matrix.postgres }}
          path: |
            security-evidence/
            tested-commit.txt
          if-no-files-found: error
